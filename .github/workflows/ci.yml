name: release-audit

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[plots,dev]"
      - name: Lint
        run: ruff check src tests tools workflows
      - name: Unit and regression tests
        run: pytest
      - name: Validate released data and result snapshots
        run: PYTHONPATH=src python tools/validate_release.py --full-data
