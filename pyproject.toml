[project]
name = "llm-provenance-tracker"
version = "0.1.0"
description = "Independent research framework for LLM provenance identification and degradation monitoring via proxy-model activations."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24.0",
  "torch>=2.4.0",
  "transformers>=4.40.0",
  "scikit-learn>=1.3.0",
  "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provenance_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
